name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: brew install libusb pkg-config xcodegen
      - run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - run: make
      - run: make test
      - run: make app audio XCODEFLAGS=CODE_SIGNING_ALLOWED=NO
