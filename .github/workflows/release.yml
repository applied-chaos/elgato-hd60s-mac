name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: macos-26
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: brew install libusb pkg-config xcodegen
      - run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Import signing certificate and profiles
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APP_PROFILE: ${{ secrets.MACOS_APP_PROFILE }}
          CAMERA_PROFILE: ${{ secrets.MACOS_CAMERA_PROFILE }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for var in CERTIFICATE_P12 CERTIFICATE_PASSWORD APP_PROFILE CAMERA_PROFILE ASC_KEY_P8; do
            [[ -n "${!var}" ]] || { echo "::error::secret for $var is empty; re-run scripts/setup-signing.sh"; exit 1; }
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$CERTIFICATE_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          for var in APP_PROFILE CAMERA_PROFILE; do
            file="$RUNNER_TEMP/$var.provisionprofile"
            echo "${!var}" | base64 -d > "$file"
            decoded="$RUNNER_TEMP/$var.plist"
            security cms -D -i "$file" > "$decoded"
            team="$(plutil -extract Entitlements.com\\.apple\\.developer\\.team-identifier raw "$decoded")"
            plutil -extract Entitlements.com\\.apple\\.security\\.application-groups json -o - "$decoded" 2>/dev/null \
              | jq -e --arg g "$team.net.mintopia.hd60s" 'index($g)' >/dev/null \
              || { echo "::error::$var profile lacks the App Group $team.net.mintopia.hd60s; add it to the App ID, regenerate the profile and re-run scripts/setup-signing.sh"; exit 1; }
            name="$(plutil -extract Name raw "$decoded")"
            uuid="$(plutil -extract UUID raw "$decoded")"
            cp "$file" "$profiles/$uuid.provisionprofile"
            echo "HD60S_${var}_NAME=$name" >> "$GITHUB_ENV"
          done

          echo "$ASC_KEY_P8" | base64 -d > "$RUNNER_TEMP/asc.p8"

      - name: Build and sign
        run: >
          make dist VERSION="${VERSION#v}"
          XCODEFLAGS="CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Developer ID Application'
          OTHER_CODE_SIGN_FLAGS=--timestamp CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO
          HD60S_APP_PROFILE='$HD60S_APP_PROFILE_NAME' HD60S_CAMERA_PROFILE='$HD60S_CAMERA_PROFILE_NAME'"

      - name: Notarise
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          dmg="build/HD60S-${VERSION#v}.dmg"
          codesign --sign "Developer ID Application" --timestamp "$dmg"
          auth=(--key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")
          id=$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --output-format json | tee /dev/stderr | jq -r .id)
          xcrun notarytool log "$id" "${auth[@]}"
          xcrun stapler staple "$dmg"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" "build/HD60S-${VERSION#v}.dmg" --title "$VERSION" --generate-notes --verify-tag

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
