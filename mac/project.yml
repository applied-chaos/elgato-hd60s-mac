name: HD60S
options:
  bundleIdPrefix: net.mintopia
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: 46A7P6HL4Z
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  HD60S:
    type: application
    platform: macOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: HD60S
        LSMinimumSystemVersion: "26.0"
    entitlements:
      path: App/HD60S.entitlements
      properties:
        com.apple.developer.system-extension.install: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.mintopia.hd60s
    dependencies:
      - target: net.mintopia.hd60s.camera
  net.mintopia.hd60s.camera:
    type: system-extension
    platform: macOS
    sources:
      - Extension
      - path: ../src/device.c
      - path: ../src/parser.c
      - path: ../src/ring.c
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Elgato HD60 S
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSystemExtensionUsageDescription: Makes the Elgato HD60 S available as a camera.
        CMIOExtension:
          CMIOExtensionMachServiceName: $(TeamIdentifierPrefix)net.mintopia.hd60s.camera
    entitlements:
      path: Extension/HD60SCamera.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.usb: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)net.mintopia.hd60s]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.mintopia.hd60s.camera
      SWIFT_OBJC_BRIDGING_HEADER: Extension/Bridging.h
      HEADER_SEARCH_PATHS: [$(SRCROOT)/../src, $(SRCROOT)/../build, /opt/homebrew/include/libusb-1.0]
      OTHER_CFLAGS: [-std=c17]
      OTHER_LDFLAGS: [/opt/homebrew/lib/libusb-1.0.a, -framework, IOKit, -framework, Security, -framework, CoreAudio]
  HD60SAudio:
    type: bundle
    platform: macOS
    sources: [Audio]
    info:
      path: Audio/Info.plist
      properties:
        CFBundleName: HD60SAudio
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFPlugInFactories:
          9C1D5B3E-60D5-4E8B-9C4A-0FD900740002: HD60S_Create
        CFPlugInTypes:
          443ABAB8-E7B3-491A-B985-BEB9187030DB: [9C1D5B3E-60D5-4E8B-9C4A-0FD900740002]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.mintopia.hd60s.audio
      WRAPPER_EXTENSION: driver
      OTHER_CFLAGS: [-std=c17]
      OTHER_LDFLAGS: [-framework, CoreFoundation]
