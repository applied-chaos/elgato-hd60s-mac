name: HD60S
options:
  bundleIdPrefix: net.mintopia
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: 46A7P6HL4Z
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
targetTemplates:
  CoreC:
    sources:
      - path: ../src/device.c
      - path: ../src/parser.c
      - path: ../src/tx.c
      - path: ../src/audio.c
      - path: ../src/colour.c
      - path: ../src/link.c
targets:
  HD60S:
    templates: [CoreC]
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: ../src/status.c
      - path: ../src/status_probe.c
      - path: ../src/status_sample.c
      - path: ../src/device_libusb.c
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Elgato HD60 S
        CFBundleName: Elgato HD60 S
        HD60SGroup: $(TeamIdentifierPrefix)net.mintopia.hd60s
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        HD60SFlavour: $(HD60S_FLAVOUR)
        NSCameraUsageDescription: Elgato HD60 S needs camera access to send your picture settings to the HD60 S camera and read its status.
    entitlements:
      path: App/HD60S.entitlements
      properties:
        com.apple.developer.system-extension.install: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)net.mintopia.hd60s]
        com.apple.security.device.camera: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.mintopia.hd60s
      SWIFT_OBJC_BRIDGING_HEADER: App/Bridging.h
      HEADER_SEARCH_PATHS: [$(SRCROOT)/../src, $(SRCROOT)/../build, $(SRCROOT)/ExtensionDext, /opt/homebrew/include/libusb-1.0]
      OTHER_CFLAGS: [-std=c17]
      OTHER_LDFLAGS: [/opt/homebrew/lib/libusb-1.0.a, -framework, IOKit, -framework, Security, -framework, CoreFoundation]
      HD60S_FLAVOUR: userspace
      PROVISIONING_PROFILE_SPECIFIER: $(HD60S_APP_PROFILE)
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: net.mintopia.hd60s.camera
      - target: HD60SAudio
        copy:
          destination: plugins
  net.mintopia.hd60s.camera:
    templates: [CoreC]
    type: system-extension
    platform: macOS
    sources:
      - Extension
      - Shared
      - path: ../src/device_libusb.c
      - path: ../src/deinterlace.c
      - path: ../src/ring.c
      - path: ../src/status.c
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Elgato HD60 S
        HD60SGroup: $(TeamIdentifierPrefix)net.mintopia.hd60s
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSystemExtensionUsageDescription: Makes the Elgato HD60 S available as a camera.
        CMIOExtension:
          CMIOExtensionMachServiceName: $(TeamIdentifierPrefix)net.mintopia.hd60s.camera
    entitlements:
      path: Extension/HD60SCamera.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.usb: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)net.mintopia.hd60s]
        com.apple.security.temporary-exception.mach-lookup.global-name: [com.apple.audio.audiohald]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.mintopia.hd60s.camera
      PROVISIONING_PROFILE_SPECIFIER: $(HD60S_CAMERA_PROFILE)
      SWIFT_OBJC_BRIDGING_HEADER: Extension/Bridging.h
      HEADER_SEARCH_PATHS: [$(SRCROOT)/../src, $(SRCROOT)/../build, /opt/homebrew/include/libusb-1.0]
      OTHER_CFLAGS: [-std=c17]
      OTHER_LDFLAGS: [/opt/homebrew/lib/libusb-1.0.a, -framework, IOKit, -framework, Security, -framework, CoreAudio]
  HD60SAudio:
    type: bundle
    platform: macOS
    sources: [Audio]
    info:
      path: Audio/Info.plist
      properties:
        CFBundleName: HD60SAudio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFPlugInFactories:
          9C1D5B3E-60D5-4E8B-9C4A-0FD900740002: HD60S_Create
        CFPlugInTypes:
          443ABAB8-E7B3-491A-B985-BEB9187030DB: [9C1D5B3E-60D5-4E8B-9C4A-0FD900740002]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.mintopia.hd60s.audio
      WRAPPER_EXTENSION: driver
      OTHER_CFLAGS: [-std=c17]
      OTHER_LDFLAGS: [-framework, CoreFoundation]
