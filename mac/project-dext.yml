name: HD60SDev
# Arrays append on include, so lists that differ from project.yml are replaced with :REPLACE.
include: [project.yml]
targets:
  HD60S:
    sources:
      - ExtensionDext/DextFeed.c
      - path: ../src/framering.c
    settings:
      HD60S_FLAVOUR: driverkit
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEXT
      GCC_PREPROCESSOR_DEFINITIONS: [HD60S_DEXT=1]
    dependencies:REPLACE:
      - target: net.mintopia.hd60s.camera
      - target: net.mintopia.hd60s.dext
  net.mintopia.hd60s.camera:
    sources:REPLACE:
      - path: Extension
        excludes: [AudioFeed.c, AudioFeed.h, Bridging.h]
      - ExtensionDext
      - Shared
      - path: ../src/status.c
      - path: ../src/device_libusb.c
      - path: ../src/deinterlace.c
      - path: ../src/framering.c
    settings:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEXT
      SWIFT_OBJC_BRIDGING_HEADER: ExtensionDext/Bridging.h
    entitlements:
      path: Extension/HD60SCameraDext.entitlements
      properties:REPLACE:
        com.apple.security.app-sandbox: true
        com.apple.security.device.usb: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)net.mintopia.hd60s]
        com.apple.security.temporary-exception.iokit-user-client-class: [IOUserUserClient]
  net.mintopia.hd60s.dext:
    templates: [CoreC]
    type: driver-extension
    platform: macOS
    sources:
      - Dext
      - path: ../src/aclock.c
      - path: ../src/framering.c
    info:
      path: Dext/Info.plist
      properties:
        CFBundleDisplayName: Elgato HD60 S
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OSBundleUsageDescription: "Runs the Elgato HD60 S: HDMI audio input and video for the camera."
        IOKitPersonalities:
          HD60SDriver:
            CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
            IOClass: IOUserService
            IOMatchCategory: $(PRODUCT_BUNDLE_IDENTIFIER)
            IOProviderClass: IOUSBHostDevice
            idVendor: 4057
            idProduct: 116
            IOUserClass: HD60SDriver
            IOUserServerName: $(PRODUCT_BUNDLE_IDENTIFIER)
            IOUserAudioDriverUserClientProperties:
              IOClass: IOUserUserClient
              IOUserClass: IOUserAudioDriverUserClient
            HD60SUserClientProperties:
              IOClass: IOUserUserClient
              IOUserClass: HD60SUserClient
    entitlements:
      path: Dext/HD60SDext.entitlements
      properties:
        com.apple.developer.driverkit: true
        com.apple.developer.driverkit.family.audio: true
        # Must equal the development profile's grant exactly or AMFI refuses to launch the dext.
        com.apple.developer.driverkit.transport.usb:
          - idVendor: "*"
        com.apple.developer.driverkit.allow-any-userclient-access: true
    settings:
      SDKROOT: driverkit
      SUPPORTED_PLATFORMS: driverkit
      DRIVERKIT_DEPLOYMENT_TARGET: "25.0"
      PRODUCT_BUNDLE_IDENTIFIER: net.mintopia.hd60s.dext
      PROVISIONING_PROFILE_SPECIFIER: ""
      CODE_SIGN_STYLE: Automatic
      OTHER_LDFLAGS: [-framework, AudioDriverKit, -framework, USBDriverKit, -framework, DriverKit]
      HEADER_SEARCH_PATHS: [$(SRCROOT)/../src, $(SRCROOT)/../build]
      GCC_C_LANGUAGE_STANDARD: c17
      ENABLE_HARDENED_RUNTIME: YES
      CLANG_CXX_LANGUAGE_STANDARD: gnu++20
